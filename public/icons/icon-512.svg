<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#g)" />
  <!-- 网格点阵，呼应 canvas 背景 -->
  <g fill="rgba(255,255,255,0.3)">
    <circle cx="120" cy="120" r="4"/>
    <circle cx="200" cy="120" r="4"/>
    <circle cx="280" cy="120" r="4"/>
    <circle cx="360" cy="120" r="4"/>
    <circle cx="120" cy="200" r="4"/>
    <circle cx="200" cy="200" r="4"/>
    <circle cx="280" cy="200" r="4"/>
    <circle cx="360" cy="200" r="4"/>
    <circle cx="120" cy="280" r="4"/>
    <circle cx="200" cy="280" r="4"/>
    <circle cx="280" cy="280" r="4"/>
    <circle cx="360" cy="280" r="4"/>
    <circle cx="120" cy="360" r="4"/>
    <circle cx="200" cy="360" r="4"/>
    <circle cx="280" cy="360" r="4"/>
    <circle cx="360" cy="360" r="4"/>
  </g>
  <!-- 中心：圆角卡片节点 -->
  <rect x="156" y="196" width="200" height="120" rx="20" fill="white" fill-opacity="0.95"/>
  <!-- 卡片顶部条 -->
  <rect x="156" y="196" width="200" height="24" rx="20" fill="#c7d2fe" fill-opacity="0.6"/>
  <!-- 连线（左下 + 右上小圆节点） -->
  <circle cx="104" cy="340" r="16" fill="#fef3c7"/>
  <circle cx="408" cy="172" r="20" fill="#dcfce7"/>
  <line x1="120" y1="340" x2="176" y2="284" stroke="rgba(99,102,241,0.6)" stroke-width="3" stroke-linecap="round"/>
  <line x1="336" y1="220" x2="388" y2="188" stroke="rgba(99,102,241,0.6)" stroke-width="3" stroke-linecap="round"/>
</svg>